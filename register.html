<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · AI 助教答疑平台</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --line: #e5e7eb;
    --txt: #111827;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent2: #4f46e5;
    --ok: #16a34a;
    --err: #dc2626;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f8fafc;
    min-height: 100vh;
    color: var(--txt);
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .card {
    width: 100%; max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 36px 40px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.06);
  }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .logo {
    width:42px; height:42px; border-radius:12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:700; color:#fff;
  }
  h1 { font-size:22px; font-weight:800; color: var(--txt); }
  .sub { color:var(--muted); font-size:13px; margin-bottom:24px; }

  fieldset {
    border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; margin-bottom:18px;
  }
  legend {
    padding:0 8px; font-size:13px; font-weight:700; color:var(--accent); letter-spacing:1px;
  }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field.full { grid-column:1 / -1; }
  label { font-size:13px; color:var(--txt); font-weight:500; }
  label .req { color:var(--err); margin-left:2px; }
  input, select, textarea {
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; color:var(--txt); font-size:14px; font-family:inherit;
    width:100%; transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder, textarea::placeholder { color:#9ca3af; }
  input:focus, select:focus, textarea:focus {
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,0.15);
  }
  input:invalid:not(:placeholder-shown), textarea:invalid:not(:placeholder-shown) { border-color: rgba(220,38,38,0.5); }
  input:valid:not(:placeholder-shown) { border-color: rgba(22,163,74,0.4); }

  .hint { font-size:11.5px; color:var(--muted); min-height:15px; }
  .hint.err { color:var(--err); }
  .hint.ok { color:var(--ok); }

  .row-flex { display:flex; align-items:center; gap:12px; }
  .row-flex input[type=range] { flex:1; }
  .row-flex output {
    min-width:52px; text-align:center; font-size:15px; font-weight:700; color:var(--accent);
    background:#f8fafc; border:1px solid var(--line); border-radius:8px; padding:4px 8px;
  }
  meter { width:100%; height:10px; }
  .check-row { display:flex; align-items:flex-start; gap:9px; font-size:13px; color:var(--txt); }
  .check-row input { width:auto; margin-top:2px; accent-color: var(--accent); }
  .check-row a { color:var(--accent); text-decoration:none; }
  .check-row a:hover { text-decoration:underline; }

  .btn-row { display:flex; gap:12px; margin-top:6px; }
  button {
    flex:1; padding:13px; border:none; border-radius:12px;
    font-size:15px; font-weight:600; font-family:inherit;
    cursor:pointer; transition: transform .1s, box-shadow .2s, background .2s;
  }
  button:active { transform: translateY(1px); }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:#1d4ed8; }
  .btn-ghost { background:#fff; color:var(--txt); border:1px solid var(--line); }
  .btn-ghost:hover { background:#f3f4f6; }
  .switch { text-align:center; margin-top:18px; font-size:13px; color:var(--muted); }
  .switch a { color:var(--accent); text-decoration:none; font-weight:600; }
  .switch a:hover { text-decoration:underline; }

  #result {
    display:none; margin-top:20px;
    background:#f0fdf4; border:1px solid #bbf7d0; border-radius:12px;
    padding:16px; font-size:13px; color:#14532d;
  }
  #result pre {
    white-space:pre-wrap; word-break:break-all;
    font-family:"Consolas","Monaco",monospace; color:#166534; margin-top:8px; line-height:1.6;
  }
  .strength-label { font-size:11.5px; color:var(--muted); }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="logo">AI</div>
    <div>
      <h1>AI 助教答疑平台</h1>
      <div class="sub">创建你的专属学习账号 · 个性化注册</div>
    </div>
  </div>

  <form id="regForm" novalidate>
    <fieldset>
      <legend>基本资料</legend>
      <div class="grid">
        <div class="field">
          <label for="name">姓名<span class="req">*</span></label>
          <input type="text" id="name" name="name" placeholder="你的真实姓名"
                 required minlength="2" maxlength="20" autocomplete="name" autofocus>
          <div class="hint" data-for="name"></div>
        </div>
        <div class="field">
          <label for="nick">昵称</label>
          <input type="text" id="nick" name="nickname" placeholder="AI 课堂里显示的名字"
                 minlength="2" maxlength="12" autocomplete="nickname">
          <div class="hint" data-for="nick"></div>
        </div>
        <div class="field">
          <label for="phone">手机号<span class="req">*</span></label>
          <input type="tel" id="phone" name="phone" placeholder="11 位手机号"
                 required pattern="1[3-9][0-9]{9}" autocomplete="tel" inputmode="numeric">
          <div class="hint" data-for="phone"></div>
        </div>
        <div class="field">
          <label for="email">邮箱<span class="req">*</span></label>
          <input type="email" id="email" name="email" placeholder="you@example.com"
                 required autocomplete="email" inputmode="email">
          <div class="hint" data-for="email"></div>
        </div>
        <div class="field">
          <label for="birth">出生日期<span class="req">*</span></label>
          <input type="date" id="birth" name="birthday" required max="2010-12-31">
          <div class="hint" data-for="birth"></div>
        </div>
        <div class="field">
          <label for="grade">入学年份<span class="req">*</span></label>
          <input type="number" id="grade" name="grade" placeholder="如 2024"
                 required min="2000" max="2026" step="1" inputmode="numeric">
          <div class="hint" data-for="grade"></div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>学习偏好（个性化）</legend>
      <div class="grid">
        <div class="field full">
          <label for="major">目标专业方向<span class="req">*</span></label>
          <input type="text" id="major" name="major" placeholder="输入或从列表选择"
                 list="majorList" required autocomplete="off">
          <datalist id="majorList">
            <option value="计算机科学与技术">
            <option value="软件工程">
            <option value="人工智能">
            <option value="数据科学与大数据">
            <option value="电子信息工程">
            <option value="数学与应用数学">
          </datalist>
          <div class="hint" data-for="major"></div>
        </div>
        <div class="field full">
          <label for="role">身份角色<span class="req">*</span></label>
          <select id="role" name="role" required>
            <option value="">请选择…</option>
            <option value="student">学生</option>
            <option value="ta">助教</option>
            <option value="teacher">教师</option>
          </select>
          <div class="hint" data-for="role"></div>
        </div>
        <div class="field full">
          <label for="level">当前学习进度（演示 &lt;progress&gt;）</label>
          <progress id="level" value="35" max="100">35%</progress>
        </div>
        <div class="field full">
          <label for="hours">每日学习时长（小时，演示 &lt;output&gt;）</label>
          <div class="row-flex">
            <input type="range" id="hours" name="hours" min="0" max="12" step="0.5" value="3">
            <output id="hoursOut" for="hours">3</output>
          </div>
        </div>
        <div class="field full">
          <label for="goal">学习目标<span class="req">*</span></label>
          <textarea id="goal" name="goal" rows="3" placeholder="希望在 AI 助教的帮助下达成什么目标？"
                    required minlength="10" maxlength="200" spellcheck="true"></textarea>
          <div class="hint" data-for="goal"></div>
        </div>
        <div class="field full">
          <label for="theme">界面主题色（演示 &lt;input type=color&gt;）</label>
          <input type="color" id="theme" name="theme" value="#2563eb">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>账号安全</legend>
      <div class="grid">
        <div class="field">
          <label for="pwd">密码<span class="req">*</span></label>
          <input type="password" id="pwd" name="password" placeholder="8–20 位，含大小写与数字"
                 required minlength="8" maxlength="20"
                 pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,20}$"
                 autocomplete="new-password">
          <div class="hint" data-for="pwd"></div>
          <meter id="pwdMeter" min="0" max="5" low="2" high="4" optimum="5" value="0"></meter>
          <div class="strength-label" id="pwdLabel">密码强度：未输入</div>
        </div>
        <div class="field">
          <label for="pwd2">确认密码<span class="req">*</span></label>
          <input type="password" id="pwd2" name="password2" placeholder="再次输入密码"
                 required autocomplete="new-password">
          <div class="hint" data-for="pwd2"></div>
        </div>
      </div>
    </fieldset>

    <div class="field" style="margin-bottom:16px;">
      <div class="check-row">
        <input type="checkbox" id="agree" name="agree" required>
        <label for="agree">我已阅读并同意 <a href="#" onclick="return false;">《用户协议》</a> 与
          <a href="#" onclick="return false;">《隐私政策》</a><span class="req">*</span></label>
      </div>
      <div class="hint" data-for="agree"></div>
    </div>

    <div class="btn-row">
      <button type="submit" class="btn-primary">注册账号</button>
      <button type="reset" class="btn-ghost">重置</button>
    </div>
  </form>

  <div id="result">
    <strong>✅ 注册信息校验通过（仅前端演示，未提交服务器）</strong>
    <pre id="resultJson"></pre>
  </div>

  <div class="switch">已有账号？<a href="login.html">去登录</a></div>
</div>

<script>
(function () {
  const form = document.getElementById('regForm');
  const hints = {};
  document.querySelectorAll('.hint').forEach(h => { hints[h.dataset.for] = h; });

  function messageFor(el) {
    const v = el.validity;
    if (v.valueMissing) return '此项为必填。';
    if (v.typeMismatch) {
      if (el.type === 'email') return '请输入正确的邮箱格式，如 you@example.com。';
      return '格式不正确。';
    }
    if (v.patternMismatch) {
      if (el.id === 'phone') return '请输入 11 位有效手机号。';
      if (el.id === 'pwd') return '密码需 8–20 位，且同时包含大写字母、小写字母和数字。';
      return '输入不符合要求。';
    }
    if (v.tooShort) return `至少需要 ${el.minLength} 个字符。`;
    if (v.tooLong) return `不能超过 ${el.maxLength} 个字符。`;
    if (v.rangeOverflow) return `不能大于 ${el.max}。`;
    if (v.rangeUnderflow) return `不能小于 ${el.min}。`;
    if (v.badInput) return '请输入有效的数字或日期。';
    return '';
  }

  function validateField(el) {
    if (!hints[el.id]) return true;
    if (el.id === 'pwd2') {
      const p = document.getElementById('pwd').value;
      if (el.value && el.value !== p) {
        hints[el.id].textContent = '两次输入的密码不一致。';
        hints[el.id].className = 'hint err';
        return false;
      }
    }
    if (el.willValidate && !el.checkValidity()) {
      hints[el.id].textContent = messageFor(el);
      hints[el.id].className = 'hint err';
      return false;
    }
    hints[el.id].textContent = el.value ? '✓ 通过' : '';
    hints[el.id].className = 'hint' + (el.value ? ' ok' : '');
    return true;
  }

  form.querySelectorAll('input, select, textarea').forEach(el => {
    el.addEventListener('blur', () => validateField(el));
    el.addEventListener('input', () => validateField(el));
  });

  const pwd = document.getElementById('pwd');
  const meter = document.getElementById('pwdMeter');
  const pwdLabel = document.getElementById('pwdLabel');
  pwd.addEventListener('input', () => {
    const v = pwd.value;
    let s = 0;
    if (v.length >= 8) s++;
    if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;
    if (/[0-9]/.test(v)) s++;
    if (/[^a-zA-Z0-9]/.test(v)) s++;
    if (v.length >= 12) s++;
    meter.value = s;
    pwdLabel.textContent = ['密码强度：未输入','密码强度：很弱','密码强度：较弱','密码强度：一般','密码强度：较强','密码强度：很强'][s];
  });

  const hours = document.getElementById('hours');
  const hoursOut = document.getElementById('hoursOut');
  hours.addEventListener('input', () => { hoursOut.value = hours.value; });

  const goal = document.getElementById('goal');
  goal.addEventListener('input', () => {
    const left = goal.maxLength - goal.value.length;
    hints['goal'].textContent = goal.value ? `还可输入 ${left} 字` : '';
    hints['goal'].className = 'hint' + (left < 0 ? ' err' : '');
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let allOk = true;
    form.querySelectorAll('input, select, textarea').forEach(el => validateField(el) || (allOk = false));
    if (pwd.value && pwd.value !== document.getElementById('pwd2').value) {
      validateField(document.getElementById('pwd2'));
      allOk = false;
    }
    if (!form.checkValidity()) {
      const firstInvalid = form.querySelector(':invalid');
      if (firstInvalid) firstInvalid.focus();
      return;
    }
    if (!allOk) return;

    const data = Object.fromEntries(new FormData(form).entries());
    document.getElementById('resultJson').textContent = JSON.stringify(data, null, 2);
    document.getElementById('result').style.display = 'block';
    document.getElementById('result').scrollIntoView({ behavior:'smooth', block:'nearest' });
  });

  form.addEventListener('reset', () => {
    setTimeout(() => {
      Object.values(hints).forEach(h => { h.textContent = ''; h.className = 'hint'; });
      document.getElementById('result').style.display = 'none';
      meter.value = 0; pwdLabel.textContent = '密码强度：未输入';
      hoursOut.value = hours.value = '3';
    }, 0);
  });
})();
</script>
</body>
</html>
