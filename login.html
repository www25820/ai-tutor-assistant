<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · AI 助教答疑平台</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --line: #e5e7eb;
    --txt: #111827;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent2: #4f46e5;
    --ok: #16a34a;
    --err: #dc2626;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f8fafc;
    min-height: 100vh;
    color: var(--txt);
    display:flex; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  .card {
    width:100%; max-width:420px;
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:36px 36px 30px;
    box-shadow:0 10px 40px rgba(0,0,0,0.06);
  }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .logo {
    width:42px; height:42px; border-radius:12px;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:700; color:#fff;
  }
  h1 { font-size:22px; font-weight:800; color:var(--txt); }
  .sub { color:var(--muted); font-size:13px; margin-bottom:24px; }

  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  label { font-size:13px; color:var(--txt); font-weight:500; }
  label .req { color:var(--err); }
  input {
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; color:var(--txt); font-size:14px; font-family:inherit;
    width:100%; transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder { color:#9ca3af; }
  input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,0.15); }
  input:invalid:not(:placeholder-shown) { border-color: rgba(220,38,38,0.5); }
  input:valid:not(:placeholder-shown) { border-color: rgba(22,163,74,0.4); }

  .hint { font-size:11.5px; color:var(--muted); min-height:15px; }
  .hint.err { color:var(--err); }
  .hint.ok { color:var(--ok); }

  .row-flex { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .check-row { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--txt); flex:1; }
  .check-row input { width:auto; accent-color: var(--accent); }
  .link { color:var(--accent); text-decoration:none; font-size:13px; white-space:nowrap; }
  .link:hover { text-decoration:underline; }

  .btn-row { display:flex; gap:12px; }
  button {
    flex:1; padding:13px; border:none; border-radius:12px;
    font-size:15px; font-weight:600; font-family:inherit;
    cursor:pointer; transition: transform .1s, background .2s;
  }
  button:active { transform: translateY(1px); }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:#1d4ed8; }
  .btn-ghost { background:#fff; color:var(--txt); border:1px solid var(--line); }
  .btn-ghost:hover { background:#f3f4f6; }

  .switch { text-align:center; margin-top:20px; font-size:13px; color:var(--muted); }
  .switch a { color:var(--accent); text-decoration:none; font-weight:600; }
  .switch a:hover { text-decoration:underline; }

  #result {
    display:none; margin-top:18px;
    background:#f0fdf4; border:1px solid #bbf7d0; border-radius:12px;
    padding:14px; font-size:13px; color:#14532d;
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="logo">AI</div>
    <div>
      <h1>AI 助教答疑平台</h1>
      <div class="sub">欢迎回来，继续你的学习之旅</div>
    </div>
  </div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="account">账号（手机号 / 邮箱）<span class="req">*</span></label>
      <input type="text" id="account" name="account" placeholder="输入手机号或邮箱"
             required autocomplete="username" inputmode="email" autofocus>
      <div class="hint" data-for="account"></div>
    </div>

    <div class="field">
      <label for="pwd">密码<span class="req">*</span></label>
      <input type="password" id="pwd" name="password" placeholder="输入密码"
             required minlength="8" autocomplete="current-password">
      <div class="hint" data-for="pwd"></div>
    </div>

    <div class="row-flex">
      <div class="check-row">
        <input type="checkbox" id="remember" name="remember" checked>
        <label for="remember">记住我</label>
      </div>
      <a class="link" href="#" onclick="return false;">忘记密码？</a>
    </div>

    <div class="btn-row">
      <button type="submit" class="btn-primary">登录</button>
      <button type="reset" class="btn-ghost">清空</button>
    </div>
  </form>

  <div id="result">✅ 登录信息校验通过（仅前端演示，未提交服务器）</div>

  <div class="switch">还没有账号？<a href="register.html">去注册</a></div>
</div>

<script>
(function () {
  const form = document.getElementById('loginForm');
  const accountHint = document.querySelector('[data-for=account]');
  const pwdHint = document.querySelector('[data-for=pwd]');
  const result = document.getElementById('result');

  function messageFor(el) {
    const v = el.validity;
    if (v.valueMissing) return '此项为必填。';
    if (v.typeMismatch) return '格式不正确。';
    if (v.tooShort) return `至少需要 ${el.minLength} 个字符。`;
    if (v.patternMismatch) return '输入不符合要求。';
    return '';
  }

  function validateAccount() {
    const el = document.getElementById('account');
    const v = el.value.trim();
    const isPhone = /^1[3-9][0-9]{9}$/.test(v);
    const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    if (!v) { accountHint.textContent = '请输入手机号或邮箱。'; accountHint.className = 'hint err'; return false; }
    if (!isPhone && !isEmail) { accountHint.textContent = '请输入有效的手机号或邮箱。'; accountHint.className = 'hint err'; return false; }
    accountHint.textContent = '✓ 通过'; accountHint.className = 'hint ok'; return true;
  }

  function validatePwd() {
    const el = document.getElementById('pwd');
    if (el.willValidate && !el.checkValidity()) {
      pwdHint.textContent = messageFor(el); pwdHint.className = 'hint err'; return false;
    }
    pwdHint.textContent = el.value ? '✓ 通过' : ''; pwdHint.className = 'hint' + (el.value ? ' ok' : ''); return true;
  }

  document.getElementById('account').addEventListener('input', validateAccount);
  document.getElementById('account').addEventListener('blur', validateAccount);
  document.getElementById('pwd').addEventListener('input', validatePwd);
  document.getElementById('pwd').addEventListener('blur', validatePwd);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const a = validateAccount();
    const p = validatePwd();
    if (a && p) {
      result.style.display = 'block';
      result.scrollIntoView({ behavior:'smooth', block:'nearest' });
    } else {
      const firstInvalid = form.querySelector(':invalid') || document.getElementById('account');
      firstInvalid.focus();
    }
  });

  form.addEventListener('reset', () => {
    setTimeout(() => {
      accountHint.textContent = ''; accountHint.className = 'hint';
      pwdHint.textContent = ''; pwdHint.className = 'hint';
      result.style.display = 'none';
    }, 0);
  });
})();
</script>
</body>
</html>
